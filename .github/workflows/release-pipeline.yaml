name: Release Pipeline (Android only)

# ============================================================
# Trigger:
#
# Run whenever a commit is pushed to the main branch.
# Commits created by this workflow contain "[skip ci]" so they
# won't trigger the workflow again.
# ============================================================
on:
  push:
    branches:
      - main
  workflow_dispatch:

# ============================================================
# Environment variables.
# ============================================================
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ============================================================
# Required so the workflow can:
# - push the version bump commit
# - create GitHub Releases
# ============================================================
permissions:
  contents: write

# ============================================================
# Map for settings that apply to all jobs.
# ============================================================
defaults:
  run:
    shell: pwsh

jobs:
  release:
    # Prevent infinite loops by ignoring commits generated by
    # this workflow.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    runs-on: [self-hosted, Windows]

    steps:
      # =======================================================
      # Checkout repository.
      #
      # fetch-depth: 0 is required because we'll push commits
      # back to the repository later.
      # =======================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # Toolchain verification.
      #
      # Checks required tools are available in PATH.
      # ============================================================
      - name: Verify toolchain
        shell: pwsh
        run: |
          Write-Host "Checking tools..."
          Write-Host "::group::Tool check results"
          $tools = @{
            "git" = @{
              cmd = "git --version"
              install = "https://git-scm.com/downloads"
            }
            "java" = @{
              cmd = "java --version"
              install = "https://www.oracle.com/java/technologies/downloads/"
            }
            "python" = @{
              cmd = "python --version"
              install = "https://www.python.org/downloads/"
            }
            "flutter" = @{
              cmd = "flutter --version"
              install = "https://docs.flutter.dev/get-started/install/windows"
            }
            "cargo" = @{
              cmd = "cargo --version"
              install = "https://www.rust-lang.org/tools/install"
            }
            "ruby" = @{
              cmd = "ruby --version"
              install = "https://rubyinstaller.org/downloads/"
            }
            "gem" = @{
              cmd = "gem --version"
              install = "https://rubygems.org/pages/download"
            }
            "fastlane" = @{
              cmd = "fastlane --version"
              install = "https://rubygems.org/gems/fastlane/"
            }
          }

          $failed = @()

          foreach ($tool in $tools.Keys) {
            $cmd = $tools[$tool].cmd
            $link = $tools[$tool].install

            try {
              Invoke-Expression $cmd | Out-Null
              Write-Host "OK: $tool"
            }
            catch {
              Write-Host "MISSING/BROKEN: $tool"
              Write-Host "Install here: $link"
              $failed += "$tool -> $link"
            }
          }
          Write-Host "::endgroup::"

          if ($failed.Count -gt 0) {
            Write-Host ""
            Write-Host "❌ TOOLCHAIN CHECK FAILED"
            Write-Host "Missing or broken tools:"

            foreach ($f in $failed) {
              Write-Host "- $f"
            }

            throw "Toolchain verification failed."
          }

          Write-Host ""
          Write-Host "✅ All tools verified successfully"
          Write-Host "::endgroup::"

      # =======================================================
      # Run Flutter doctor.
      # =======================================================
      - name: Check Flutter
        run: flutter doctor

      # =======================================================
      # Cache Cargo dependencies and build artifacts.
      #
      # This dramatically speeds up later builds.
      # =======================================================
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        env:
          CARGO_HOME: ${{ env.USERPROFILE }}\.cargo

      # ========================================================
      # Cache Flutter pub packages. (~/.pub-cache)
      #
      # Avoids re-downloading dependencies every run.
      # ========================================================
      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\Pub\Cache
            ${{ env.APPDATA }}\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # ========================================================
      # Cache Android Gradle. (speeds up APK builds)
      # ========================================================
      - name: Cache Gradle
        uses: actions/cache@v4
        env:
          GRADLE_USER_HOME: ${{ env.USERPROFILE }}\.gradle
        with:
          path: |
            ${{ env.USERPROFILE }}\.gradle\caches
            ${{ env.USERPROFILE }}\.gradle\wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # =======================================================
      # Download Flutter packages.
      # =======================================================
      - name: Get Flutter dependencies
        run: flutter pub get

      # =======================================================
      # Verify Rust formatting.
      #
      # Fails if any Rust source file is not formatted according
      # to rustfmt. This helps keep the codebase consistent.
      # =======================================================
      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      # =======================================================
      # Run Clippy.
      #
      # Clippy is Rust's official linter. The workflow fails if
      # any warning is reported.
      # =======================================================
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # =======================================================
      # Verify Dart formatting.
      #
      # Fails if any Dart file is not formatted according to the
      # official formatter.
      # =======================================================
      - name: Check Dart formatting
        run: dart format --set-exit-if-changed .

      # =======================================================
      # Run Flutter static analysis.
      #
      # Detects many programming errors before compilation,
      # including:
      # - undefined variables
      # - unused imports
      # - invalid null-safety usage
      # - type mismatches
      # - deprecated APIs
      # =======================================================
      - name: Analyze Flutter project
        run: flutter analyze

      # =======================================================
      # Run Rust unit tests.
      # =======================================================
      - name: Run Rust tests
        run: cargo test --workspace

      # =======================================================
      # Run Flutter tests.
      # =======================================================
      - name: Run Flutter tests
        run: flutter test

      # =======================================================
      # Increment version in pubspec.yaml.
      #
      # Example:
      # 1.0.4+15
      # becomes
      # 1.0.5+16
      #
      # The version is exposed as an output for later steps.
      # =======================================================
      - name: Bump version
        id: version
        run: python .github/scripts/bump_version.py

      # =======================================================
      # Build release APK.
      #
      # If this fails, no version commit or Release is created.
      # =======================================================
      - name: Build APK
        run: flutter build apk --release

      # ======================================================
      # Build Android App Bundle (required for Play Store)
      # ======================================================
      #- name: Build AAB
      #  run: flutter build appbundle --release

      # =======================================================
      # Commit the updated pubspec.yaml.
      #
      # "[skip ci]" prevents an infinite workflow loop.
      # =======================================================
      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add pubspec.yaml

          git commit -m "Bump version to ${{ steps.version.outputs.VERSION }} [skip ci]"

          if ($LASTEXITCODE -eq 0) {
              git push
          }

      # =======================================================
      # Generate changelog for release description.
      # =======================================================
      - name: Generate changelog
        id: changelog
        run: |
          $prevTag = git describe --tags --abbrev=0 2>$null

          if (-not $prevTag) {
              $log = git log --pretty=format:"- %s"
          }
          else {
              $log = git log "$prevTag..HEAD" --pretty=format:"- %s"
          }

          "CHANGELOG<<EOF" >> $env:GITHUB_OUTPUT
          $log >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      # ======================================================
      # Upload to Google Play (Internal track example)
      # ======================================================
      #- name: Upload to Play Store
      #  env:
      #    SUPPLY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      #  run: |
      #    $env:SUPPLY_JSON_KEY | Out-File `
      #      -FilePath service_account.json `
      #      -Encoding utf8

      #    fastlane supply `
      #        --aab build/app/outputs/bundle/release/app-release.aab `
      #        --track internal `
      #        --json_key service_account.json `
      #        --package_name com.project.still_alive

      # =======================================================
      # Create the GitHub Release and upload the APK.
      # =======================================================
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.SHORT }}"

          gh release create `
            $tag `
            "build/app/outputs/flutter-apk/app-release.apk#StillAlive.apk" `
            --title $tag `
            --notes "Changelog:\n${{ steps.changelog.outputs.CHANGELOG }}" `
            --draft --prerelease
