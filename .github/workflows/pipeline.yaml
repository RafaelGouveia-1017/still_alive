name: Bump & Release Pipeline

# ============================================================
# Trigger:
#
# Run whenever a commit is pushed to the main branch.
# Commits created by this workflow contain "[skip bump]" and
# "[skip release]" so they won't trigger their respective
# workflows again.
# ============================================================
on:
  push:
    branches:
      - main
  workflow_dispatch:

# ============================================================
# Environment variables.
# ============================================================
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ============================================================
# Concurrency protection:
#
# For when 2 pushes to main happen close together.
# ============================================================
concurrency:
  group: release-android
  cancel-in-progress: false

# ============================================================
# Required so the workflow can:
# - push the version bump commit
# - create GitHub Releases
# ============================================================
permissions:
  contents: write

# ============================================================
# Map for settings that apply to all jobs.
# ============================================================
defaults:
  run:
    shell: pwsh

jobs:
  bump_patch:
    # Prevent infinite loops by ignoring commits generated by
    # this workflow.
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip bump]') }}

    runs-on: [self-hosted, Windows]

    steps:
      # =======================================================
      # Checkout repository.
      # =======================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Toolchain verification.
      #
      # Checks required tools are available in PATH.
      # ============================================================
      - name: Verify toolchain
        shell: pwsh
        run: |
          Write-Host "Checking tools..."
          Write-Host "::group::Tool check results"

          if (Get-Command python -ErrorAction SilentlyContinue) {
            Write-Host "OK: python"
          } else {
            Write-Host "MISSING/BROKEN: python"
            Write-Host "Install here: https://www.python.org/downloads/"
            Write-Host "python -> https://www.python.org/downloads/"

            Write-Host ""
            Write-Host "❌ TOOLCHAIN CHECK FAILED"
            Write-Host ""

            throw "Toolchain verification failed."
          }

          Write-Host "::endgroup::"

          Write-Host ""
          Write-Host "✅ All tools verified successfully"
          Write-Host ""

      # =======================================================
      # Increment patch version in pubspec.yaml.
      #
      # Example:
      # 1.0.4+15
      # becomes
      # 1.0.5+15
      #
      # The version is exposed as an output for later steps.
      # =======================================================
      - name: Bump patch version
        id: version
        run: python .github/scripts/bump_version.py patch

      # =======================================================
      # Commit the updated pubspec.yaml.
      #
      # "[skip bump]" prevents an infinite workflow loop.
      # =======================================================
      - name: Commit patch bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add pubspec.yaml

          git commit -m "Bump patch version to ${{ steps.version.outputs.SHORT }}" -m "[skip bump] [skip release]"

          if ($LASTEXITCODE -eq 0) {
              git push
          }

  release:
    #wait for bump_patch to finish
    needs: bump_patch

    # Release execution rules:
    #
    # - Wait for bump_patch to complete before starting.
    # - Allow release to continue when bump_patch was intentionally skipped
    #   because the commit contained "[skip bump]".
    # - Do not run after workflow cancellation.
    # - Avoid running for GitHub Actions bot-triggered workflow runs.
    # - Skip release when the commit contains "[skip release]".
    #
    # Results:
    # Normal commit:
    #   bump_patch ✅ -> release ✅
    #
    # "[skip bump]":
    #   bump_patch ❌ -> release ✅
    #
    # "[skip release]":
    #   bump_patch ✅ -> release ❌
    #
    # "[skip bump] [skip release]":
    #   bump_patch ❌ -> release ❌
    if: |
      !cancelled() &&
      (needs.bump_patch.result == 'success' || needs.bump_patch.result == 'skipped') &&
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip release]')

    runs-on: [self-hosted, Windows]

    steps:
      # =======================================================
      # Checkout repository.
      #
      # fetch-depth: 0 is required because we'll push commits
      # back to the repository later.
      # =======================================================
      - name: Checkout updated main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ============================================================
      # Toolchain verification.
      #
      # Checks required tools are available in PATH.
      # ============================================================
      - name: Verify toolchain
        shell: pwsh
        run: |
          $rubyBin = Get-ChildItem "C:\Ruby*-x64\bin" -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($rubyBin) {
              $rubyPath = $rubyBin.FullName

              Add-Content -Path $env:GITHUB_PATH -Value $rubyPath
              $env:Path = "$rubyPath;$env:Path"

              Write-Host "Added Ruby to workflow PATH: $rubyPath"
          } else {
              throw "Ruby not found on disk."
          }

          Write-Host "Checking tools..."
          Write-Host "::group::Tool check results"
          $tools = @{
            "git" = @{
              cmd = "git"
              install = "https://git-scm.com/downloads"
            }
            "java" = @{
              cmd = "java"
              install = "https://www.oracle.com/java/technologies/downloads/"
            }
            "python" = @{
              cmd = "python"
              install = "https://www.python.org/downloads/"
            }
            "flutter" = @{
              cmd = "flutter"
              install = "https://docs.flutter.dev/get-started/install/windows"
            }
            "cargo" = @{
              cmd = "cargo"
              install = "https://www.rust-lang.org/tools/install"
            }
            "ruby" = @{
              cmd = "ruby"
              install = "https://rubyinstaller.org/downloads/"
            }
            "gem" = @{
              cmd = "gem"
              install = "https://rubygems.org/pages/download"
            }
            "fastlane" = @{
              cmd = "fastlane"
              install = "https://rubygems.org/gems/fastlane/"
            }
            "github cli" = @{
              cmd = "gh"
              install = "https://cli.github.com/"
            }
          }

          $failed = @()

          foreach ($tool in $tools.Keys) {
            $exe = $tools[$tool].cmd
            $link = $tools[$tool].install

            if (Get-Command $exe -ErrorAction SilentlyContinue) {
              Write-Host "OK: $tool"
            } else {
              Write-Host "MISSING/BROKEN: $tool"
              Write-Host "Install here: $link"
              $failed += "$tool -> $link"
            }
          }
          Write-Host "::endgroup::"

          if ($failed.Count -gt 0) {
            Write-Host ""
            Write-Host "❌ TOOLCHAIN CHECK FAILED"
            Write-Host "Missing or broken tools: (Not in PATH)"

            foreach ($f in $failed) {
              Write-Host "- $f"
            }
            Write-Host ""

            throw "Toolchain verification failed."
          }

          Write-Host ""
          Write-Host "✅ All tools verified successfully"
          Write-Host ""

      # =======================================================
      # Run Flutter doctor.
      # =======================================================
      - name: Check Flutter
        run: flutter doctor

      # =======================================================
      # Download Flutter packages.
      # =======================================================
      - name: Get Flutter dependencies
        run: flutter pub get

      # =======================================================
      # Verify Rust formatting.
      #
      # Fails if any Rust source file is not formatted according
      # to rustfmt. This helps keep the codebase consistent.
      # =======================================================
      - name: Check Rust formatting
        working-directory: rust
        run: cargo fmt --all -- --check

      # =======================================================
      # Run Clippy.
      #
      # Clippy is Rust's official linter. The workflow fails if
      # any warning is reported.
      # =======================================================
      - name: Run Clippy
        working-directory: rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      # =======================================================
      # Verify Dart formatting.
      #
      # Fails if any Dart file is not formatted according to the
      # official formatter.
      # =======================================================
      - name: Check Dart formatting
        run: dart format --set-exit-if-changed lib/data lib/services lib/views

      # =======================================================
      # Run Flutter static analysis.
      #
      # Detects many programming errors before compilation,
      # including:
      # - undefined variables
      # - unused imports
      # - invalid null-safety usage
      # - type mismatches
      # - deprecated APIs
      # =======================================================
      - name: Analyze Flutter project
        run: flutter analyze

      # =======================================================
      # Recreate keystore from base64 string.
      #
      # Contains upload key necessary for signing APK & Bundle.
      # =======================================================
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes(
            "android/upload-keystore.jks",
            $bytes
          )

      # =======================================================
      # Generate key.properties file.
      #
      # Used with keystore as part of the signing process.
      # =======================================================
      - name: Create key.properties
        run: |
          @"
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          "@ | Out-File `
            -FilePath android/key.properties `
            -Encoding utf8

      # =======================================================
      # Run Rust unit tests.
      # =======================================================
      - name: Run Rust tests
        working-directory: rust
        run: cargo test --workspace

      # =======================================================
      # Run Flutter tests.
      # =======================================================
      - name: Run Flutter tests
        run: flutter test

      # =======================================================
      # Run Flutter integration tests.
      # =======================================================
      - name: Run Flutter integration tests
        run: flutter test integration_test

      # =======================================================
      # Increment version in pubspec.yaml.
      #
      # Example:
      # 1.0.4+15
      # becomes
      # 1.0.4+16
      #
      # The version is exposed as an output for later steps.
      # =======================================================
      - name: Bump build version
        id: version
        run: python .github/scripts/bump_version.py build

      # =======================================================
      # Build release APK.
      #
      # If this fails, no version commit or Release is created.
      # =======================================================
      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      # ======================================================
      # Build Android App Bundle (required for Play Store)
      #
      # If this fails, no version commit or Release is created.
      # ======================================================
      - name: Build AAB
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      # =======================================================
      # Commit the updated pubspec.yaml.
      #
      # "[skip bump]" prevents an infinite workflow loop.
      # =======================================================
      - name: Commit build bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add pubspec.yaml

          git commit -m "Bump build version to ${{ steps.version.outputs.VERSION }}" -m "[skip bump] [skip release]"

          if ($LASTEXITCODE -eq 0) {
              git push
          }

      # =======================================================
      # Generate changelog for release description.
      # =======================================================
      - name: Generate changelog
        id: changelog
        run: |
          $prevTag = git describe --tags --abbrev=0 2>$null

          if (-not $prevTag) {
              $log = git log --pretty=format:"- %s"
          }
          else {
              $log = git log "$prevTag..HEAD" --pretty=format:"- %s"
          }

          "CHANGELOG<<EOF" >> $env:GITHUB_OUTPUT
          $log >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      # ======================================================
      # Upload to Google Play
      #
      # Optional Google Play tracks: (--track <track>)
      # | Track      | Use             |
      # | ---------- | --------------- |
      # | internal   | fast testing    |
      # | alpha      | limited testers |
      # | beta       | wider testing   |
      # | production | public release  |
      # ======================================================
      - name: Upload to Play Store
        env:
          SUPPLY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          $env:SUPPLY_JSON_KEY | Out-File `
            -FilePath service_account.json `
            -Encoding utf8

          fastlane supply `
              --aab build/app/outputs/bundle/release/app-release.aab `
              --track internal `
              --json_key service_account.json `
              --package_name com.appsbyrafa.stillalive

      # =======================================================
      # Create the GitHub Release and upload the APK.
      # =======================================================
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.VERSION }}"

          $logo = "https://lh3.googleusercontent.com/kewa78VhdxECe_P9m5CenxAQ29ElE5SkF2WDqRsOFWH9SKK6pP4gCRk4FeMsjvyQEN8LREGJ_so20ZcT0lbrjlk=s0?imgmax=0"

          $notes = @"
          <div align="center">
            <picture>
              <img alt="StillAlive" src="$logo" width="15%">
            </picture>
          </div>
          <div align="center">
          <h1>StillAlive - Personal Safety Platform</h1>
          </div>
          <div align="center">
            <a href="https://developer.android.com/develop">
              <img
                src="https://img.shields.io/badge/Android-Min%3A%2010%20(API%2029)%20%7C%20Target%3A%2016%20(API%2036)-green?logo=android"
                alt="Android"
              />
            </a>
            <br>
            <a href="https://flutter.dev">
              <img
                src="https://img.shields.io/badge/Frontend-Flutter-%2302569B?logo=flutter"
                alt="Flutter"
              />
            </a>
            <a href="https://dart.dev/">
              <img
                src="https://img.shields.io/badge/Frontend-Dart-%2302569B?logo=dart"
                alt="Dart"
              />
            </a>
            <a href="https://www.rust-lang.org/">
              <img
                src="https://img.shields.io/badge/BackEnd-Rust-orange?logo=rust"
                alt="Rust"
              />
            </a>
            <br>
            <a href="https://opensource.org/licenses/MIT">
              <img
                src="https://img.shields.io/badge/License-MIT-yellow?logo=data:image/svg+xml;base64,"
                alt="MIT License"
              />
            </a>
          </div>

          ---

          **Changelog:**
          ${{ steps.changelog.outputs.CHANGELOG }}
          "@

          gh release create `
            $tag `
            "build/app/outputs/flutter-apk/app-release.apk#StillAlive.apk" `
            --title $tag `
            --notes $notes `
            --prerelease
